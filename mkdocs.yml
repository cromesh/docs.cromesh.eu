site_name: CroMesh Dokumentacija
site_description: Dokumentacija za CroMesh mrežu i Meshtastic konfiguraciju
site_author: CroMesh zajednica
site_url: https://docs.cromesh.eu
repo_name: cromesh/docs.cromesh.eu
repo_url: https://github.com/cromesh/docs.cromesh.eu
nav:
  - 🏠 Home: index.md
  - 📖 Početak:
    - Uvod u Meshtastic: uvod.md
    - Prvi koraci: postavke/prvi-koraci.md  # namjerno duplicirano i pod Postavke
  - ❓ Česta pitanja:
    - Česta pitanja: faq.md
    - O zajednici: zajednica/o-zajednici.md
    - Pravila: zajednica/pravila.md
    - MeshCore: meshcore/index.md
  - ⚙️ Postavke:
    - Postavke: postavke/index.md
    - Prvi koraci: postavke/prvi-koraci.md  # namjerno duplicirano i pod Početak
    - Lora: postavke/lora-postavke.md
    - Channels: postavke/channel-postavke.md
    - User: postavke/user-postavke.md
    - Device: postavke/device-postavke.md
    - MQTT: postavke/mqtt-postavke.md
  - 💻 Odabir uređaja:
    - Odabir Uređaja: odabir-uredaja/index.md
    - ESP32: odabir-uredaja/esp32.md
    - NRF52: odabir-uredaja/nrf52.md
    - RP2040: odabir-uredaja/rp2040.md
    - Zaključak: odabir-uredaja/zakljucak.md
  - 🔧 Hardware:
    - Hardware: hardver/index.md
    - Antene: antene/index.md
    - Montaža i zaštita: hardver/montaza-i-zastita.md
    - 3D print kućišta: hardver/3d-print.md
    - Solarni uređaji: solarno/index.md
    - Oživljavanje LiIon: hardver/ozivljavanje-18650.md
  - 💾 Software:
    - Aplikacije: aplikacije/index.md
    - Firmware: firmware/index.md
    - MQTT: mqtt/index.md
  - 🌍 Mreža:
    - Standardi: mreza/standardi.md
    - Kanali: mreza/kanali.md
    - Uloge i imenovanje: mreza/uloge-i-imenovanje.md
theme:
  name: material
  language: hr
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: black
    accent: red
  font:
    text: Roboto
    code: Roboto Mono
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search:
      lang: en
  - tags
copyright: >
  Copyright &copy; 2026 CroMesh (cromesh.eu) — sadržaj dostupan pod licencom
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/cromesh
    - icon: fontawesome/brands/github
      link: https://github.com/CroMesh
    - icon: material/web
      link: https://cromesh.eu
  generator: false
